---
- name: Verify Telegraf configured over telegraf_config_link
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Only a configuration fetched from the file server can produce this: the
    # measurement name and the `host` tag exist nowhere on the Telegraf host, and the
    # `molecule_env_marker` tag additionally has to be resolved from the environment
    # file the role renders locally. Tags are emitted in alphabetical order.
    telegraf_molecule_expected_metric: >-
      {{ telegraf_molecule_metric_name }},host={{ telegraf_molecule_agent_hostname }},molecule_env_marker={{ telegraf_molecule_env_marker }} used_percent=

  tasks:
    # Only leaf literals may be read from here. Scenario-tuned values live in the
    # scenario's group_vars and would be shadowed by these role-wide defaults.
    - name: Read the role's defaults for Telegraf
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: telegraf_role_defaults

    - name: Wait for Telegraf service to become active (up to 180s)
      ansible.builtin.systemd:
        name: telegraf.service
      register: telegraf_service
      until: telegraf_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Telegraf service is active
      ansible.builtin.assert:
        that: telegraf_service.status.ActiveState == 'active'
        fail_msg: "telegraf.service not active ({{ telegraf_service.status.ActiveState }})"
        success_msg: "telegraf.service is active"

    - name: Retrieve Telegraf service log for debugging
      when: telegraf_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu telegraf.service
      changed_when: false

    - name: Check whether a local Telegraf configuration file exists
      ansible.builtin.stat:
        path: /telegraf/telegraf.conf
      register: telegraf_local_configuration

    - name: Assert no local configuration file exists
      ansible.builtin.assert:
        that:
          - not telegraf_local_configuration.stat.exists
        fail_msg: >-
          /telegraf/telegraf.conf exists, so metrics could be explained by a local
          configuration rather than by the one served over telegraf_config_link
        success_msg: "No local configuration file exists; the configuration can only come from telegraf_config_link"

    - name: Inspect the Telegraf container
      ansible.builtin.command:
        cmd: docker inspect telegraf
      register: telegraf_container_inspect
      changed_when: false

    - name: Assert the container runs the pinned image, configured from the link
      vars:
        telegraf_container: "{{ telegraf_container_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - telegraf_container.State.Running | bool
          # The version Renovate bumps, on the container that is actually running.
          - telegraf_container.Config.Image == 'docker.io/library/telegraf:' ~ telegraf_role_defaults.telegraf_version
          # Exactly one `--config`, carrying the link. An empty or missing argument
          # here makes Telegraf refuse to start ("flag needs an argument").
          - telegraf_container.Config.Cmd == ['--config', telegraf_config_link]
          - telegraf_container.Mounts | selectattr('Destination', 'equalto', '/etc/telegraf/telegraf.conf') | list | length == 0
          # telegraf_container_additional_networks_custom put it on the file server's
          # network in addition to the one the role manages. That one is named after
          # `telegraf_identifier`, which this scenario leaves at its default.
          - telegraf_container.NetworkSettings.Networks.keys() | list | sort == [telegraf_molecule_config_server_network, 'telegraf'] | sort
        fail_msg: "The Telegraf container is not what the role's systemd unit describes"
        success_msg: "The Telegraf container runs the pinned image, configured from telegraf_config_link"

    - name: Wait for Telegraf to report itself started and to emit metrics (up to 180s)
      ansible.builtin.command:
        cmd: journalctl --unit telegraf.service --no-pager --lines 500
      register: telegraf_journal
      changed_when: false
      # Two metrics rather than one: Telegraf has then survived a full flush interval
      # past its first one, which a restart-looping agent never reaches.
      until: telegraf_journal.stdout.count(telegraf_molecule_expected_metric) >= 2
      retries: 36
      delay: 5

    - name: Assert Telegraf fetched its configuration from the link and runs the pinned version
      ansible.builtin.assert:
        that:
          - "'Loading config: ' ~ telegraf_config_link in telegraf_journal.stdout"
          # The running process's own idea of its version, against the leaf literal
          # that Renovate bumps. The trailing space keeps 1.39.3 from matching 1.39.30.
          - "'Starting Telegraf ' ~ telegraf_role_defaults.telegraf_version ~ ' ' in telegraf_journal.stdout"
        fail_msg: "Telegraf did not load {{ telegraf_config_link }}, or does not run version {{ telegraf_role_defaults.telegraf_version }}"
        success_msg: "Telegraf {{ telegraf_role_defaults.telegraf_version }} loaded its configuration from {{ telegraf_config_link }}"

    - name: Assert Telegraf emitted metrics that only the served configuration could produce
      ansible.builtin.assert:
        that:
          - telegraf_journal.stdout.count(telegraf_molecule_expected_metric) >= 2
        fail_msg: "No metric matching '{{ telegraf_molecule_expected_metric }}' reached the journal"
        success_msg: "Telegraf collected and wrote out metrics carrying this scenario's markers"

    - name: Show Telegraf systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Telegraf systemd: {{ telegraf_service.status.ActiveState }}"
          - "Configuration source: {{ telegraf_config_link }}"
          - "Metrics observed: {{ telegraf_journal.stdout.count(telegraf_molecule_expected_metric) }}"
