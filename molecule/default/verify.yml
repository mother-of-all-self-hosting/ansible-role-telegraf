---
- name: Verify Telegraf
  hosts: all
  become: true
  gather_facts: false

  vars:
    # The prefix of an InfluxDB line-protocol metric that only this scenario's
    # rendered configuration can produce:
    #
    # - the measurement name comes from `name_override` and does not exist in the
    #   sample configuration baked into the container image
    # - the `host` tag comes from this scenario's `[agent] hostname`
    # - the `molecule_env_marker` tag can only be resolved from the environment file
    #   the role renders (an unresolved `${...}` reference is emitted literally)
    #
    # Tags are emitted in alphabetical order by Telegraf's influx serializer.
    telegraf_molecule_expected_metric: >-
      {{ telegraf_molecule_metric_name }},host={{ telegraf_molecule_agent_hostname }},molecule_env_marker={{ telegraf_molecule_env_marker }} used_percent=

  tasks:
    # Only leaf literals may be read from here. Scenario-tuned values live in the
    # scenario's group_vars and would be shadowed by these role-wide defaults.
    - name: Read the role's defaults for Telegraf
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: telegraf_role_defaults

    - name: Wait for Telegraf service to become active (up to 180s)
      ansible.builtin.systemd:
        name: telegraf.service
      register: telegraf_service
      until: telegraf_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Telegraf service is active
      ansible.builtin.assert:
        that: telegraf_service.status.ActiveState == 'active'
        fail_msg: "telegraf.service not active ({{ telegraf_service.status.ActiveState }})"
        success_msg: "telegraf.service is active"

    - name: Retrieve Telegraf service log for debugging
      when: telegraf_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu telegraf.service
      changed_when: false

    - name: Read the Telegraf configuration file rendered by the role
      ansible.builtin.slurp:
        src: /telegraf/telegraf.conf
      register: telegraf_rendered_configuration

    - name: Assert the rendered configuration file is the one this scenario asked for
      vars:
        telegraf_rendered_configuration_content: "{{ telegraf_rendered_configuration.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'name_override = \"' ~ telegraf_molecule_metric_name ~ '\"' in telegraf_rendered_configuration_content"
          - "'hostname = \"' ~ telegraf_molecule_agent_hostname ~ '\"' in telegraf_rendered_configuration_content"
          - "'${MOLECULE_ENV_MARKER}' in telegraf_rendered_configuration_content"
        fail_msg: "/telegraf/telegraf.conf does not carry what telegraf_configuration asked for"
        success_msg: "/telegraf/telegraf.conf carries what telegraf_configuration asked for"

    - name: Read the environment file rendered by the role
      ansible.builtin.slurp:
        src: /telegraf/env
      register: telegraf_rendered_env

    - name: Assert the environment file carries the additional variables
      ansible.builtin.assert:
        that:
          - "'MOLECULE_ENV_MARKER=' ~ telegraf_molecule_env_marker in (telegraf_rendered_env.content | b64decode)"
        fail_msg: "/telegraf/env does not carry telegraf_environment_variables_additional_variables"
        success_msg: "/telegraf/env carries telegraf_environment_variables_additional_variables"

    - name: Inspect the Telegraf container
      ansible.builtin.command:
        cmd: docker container inspect telegraf
      register: telegraf_container_inspect
      changed_when: false

    - name: Assert the container runs the pinned image with the expected arguments
      vars:
        telegraf_container: "{{ telegraf_container_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - telegraf_container.State.Running | bool
          # The version Renovate bumps, on the container that is actually running.
          - telegraf_container.Config.Image == 'docker.io/library/telegraf:' ~ telegraf_role_defaults.telegraf_version
          # Exactly one `--config`, pointing at the mounted file. An empty or missing
          # argument here makes Telegraf refuse to start ("flag needs an argument").
          - telegraf_container.Config.Cmd == ['--config', '/etc/telegraf/telegraf.conf']
          - telegraf_container.HostConfig.ReadonlyRootfs | bool
          - telegraf_container.Mounts | selectattr('Destination', 'equalto', '/etc/telegraf/telegraf.conf') | selectattr('RW', 'equalto', false) | list | length == 1
        fail_msg: "The Telegraf container is not what the role's systemd unit describes"
        success_msg: "The Telegraf container runs the pinned image with the expected arguments"

    - name: Wait for Telegraf to report itself started and to emit metrics (up to 180s)
      ansible.builtin.command:
        cmd: journalctl --unit telegraf.service --no-pager --lines 500
      register: telegraf_journal
      changed_when: false
      # Two metrics rather than one: Telegraf has then survived a full flush interval
      # past its first one, which a restart-looping agent never reaches.
      until: telegraf_journal.stdout.count(telegraf_molecule_expected_metric) >= 2
      retries: 36
      delay: 5

    - name: Assert Telegraf loaded the role's configuration and runs the pinned version
      ansible.builtin.assert:
        that:
          - "'Loading config: /etc/telegraf/telegraf.conf' in telegraf_journal.stdout"
          # The running process's own idea of its version, against the leaf literal
          # that Renovate bumps. The trailing space keeps 1.39.3 from matching 1.39.30.
          - "'Starting Telegraf ' ~ telegraf_role_defaults.telegraf_version ~ ' ' in telegraf_journal.stdout"
        fail_msg: "Telegraf did not load the role's configuration, or does not run version {{ telegraf_role_defaults.telegraf_version }}"
        success_msg: "Telegraf {{ telegraf_role_defaults.telegraf_version }} loaded the role's configuration"

    - name: Assert Telegraf emitted metrics that only the role's configuration could produce
      ansible.builtin.assert:
        that:
          - telegraf_journal.stdout.count(telegraf_molecule_expected_metric) >= 2
        fail_msg: "No metric matching '{{ telegraf_molecule_expected_metric }}' reached the journal"
        success_msg: "Telegraf collected and wrote out metrics carrying this scenario's markers"

    - name: Show Telegraf systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Telegraf systemd: {{ telegraf_service.status.ActiveState }}"
          - "Metrics observed: {{ telegraf_journal.stdout.count(telegraf_molecule_expected_metric) }}"
